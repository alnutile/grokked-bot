# Builds the Mac .dmgs, the Linux .deb and AppImage, and the bot computer image
# they pull on first run. To cut a release, merge a PR that bumps the version in
# apps/desktop/src-tauri/tauri.conf.json (and the other version files, see CLAUDE.md).
# When main gets a version that has no tag yet, this builds and smoke-tests both Macs and
# Linux, tags the commit vX.Y.Z and opens a *draft* GitHub release with the notes from
# .github/release-notes.md. Publish it from the Releases page.
#
# Pushing a tag by hand (git tag v0.2.0 && git push origin v0.2.0) still works. Running
# it from the Actions tab on main releases the current version if it has no tag yet
# (handy to retry a failed release); on any other branch it is a test build. File names never change, so
#   https://github.com/<owner>/<repo>/releases/latest/download/Grokked-Bot-mac-apple-silicon.dmg
# always serves the newest one.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['apps/desktop/src-tauri/tauri.conf.json']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/grokked-computer

jobs:
  # Which version this is, and whether to build and release it. A push to main only
  # releases a version that has no tag yet, so other edits to tauri.conf.json are a no-op.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"; BUILD=true; RELEASE=true
          else
            V="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"; BUILD=true; RELEASE=false
            # A merge to main, or "Run workflow" on main, releases an untagged version.
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
                echo "v$V is already tagged; nothing to release"; BUILD=false
              else
                RELEASE=true
              fi
            fi
          fi
          echo "version=$V build=$BUILD release=$RELEASE"
          { echo "version=$V"; echo "build=$BUILD"; echo "release=$RELEASE"; } >> "$GITHUB_OUTPUT"

  computer-image:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: real Google Chrome doesn't ship for Linux arm64. Apple
      # Silicon runs it under Rosetta.
      # The app asks for the image tagged with its own version, so every
      # release must publish that tag (an upgrade pulls it on first launch).
      - uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ needs.version.outputs.release == 'true' && format('{0}:{1}', env.IMAGE, needs.version.outputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mac-app:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: apple-silicon
          - target: x86_64-apple-darwin
            label: intel
    # Both build on an Apple Silicon runner; Intel is a cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      # The tag is the version: v0.2.0 -> 0.2.0 in the app's About and Info.plist.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop/src-tauri
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' tauri.conf.json > t.json && mv t.json tauri.conf.json
          jq -r .version tauri.conf.json
      - run: node scripts/build.mjs
      - run: scripts/fetch-node.sh ${{ matrix.target }}
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
        working-directory: apps/desktop

      # Start the daemon the way the app does -- the bundled node, inside the
      # signed .app, on the bundled daemon -- and require a healthy answer.
      # A signing problem (e.g. V8 can't JIT under the hardened runtime) kills
      # node before any of our code runs, and only shows up here or on a Mac.
      # Native arch only: the runner is Apple Silicon.
      - name: Smoke test the bundled daemon
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          APP="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Grokked Bot.app"
          codesign -dv --verbose=2 "$APP/Contents/MacOS/grokked-node" 2>&1 | grep -iE "flags|signature" || true
          export HOME="$(mktemp -d)" GROKKED_PORT=8790
          "$APP/Contents/MacOS/grokked-node" "$APP/Contents/Resources/daemon/grokked.mjs" > daemon.log 2>&1 &
          TOKEN_FILE="$HOME/Library/Application Support/Grokked/token"
          for i in $(seq 1 30); do
            if [ -f "$TOKEN_FILE" ] && curl -sf -H "authorization: Bearer $(cat "$TOKEN_FILE")" \
                 http://127.0.0.1:8790/v1/health; then echo; echo "daemon healthy"; kill %1; exit 0; fi
            sleep 1
          done
          echo "daemon never became healthy:"; cat daemon.log; ls -R "$APP/Contents" | head -40; exit 1

      # Fixed names, so releases/latest/download/<name> links never go stale.
      - name: Name the dmg
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
             "out/Grokked-Bot-mac-${{ matrix.label }}.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: grokked-bot-mac-${{ matrix.label }}
          path: out/*.dmg

  linux-app:
    needs: version
    if: needs.version.outputs.build == 'true'
    # 24.04's glibc: the AppImage runs on Ubuntu 24.04 / Debian 13 and newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop/src-tauri
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' tauri.conf.json > t.json && mv t.json tauri.conf.json
          jq -r .version tauri.conf.json
      - run: node scripts/build.mjs
      - run: scripts/fetch-node.sh x86_64-unknown-linux-gnu
      # The sidecar and daemon only go into release builds, so `tauri dev`
      # doesn't need them.
      - run: pnpm tauri build --config src-tauri/tauri.linux-release.conf.json
        working-directory: apps/desktop

      # Install the .deb for real and start its daemon the way the app does.
      - name: Smoke test the installed daemon
        run: |
          sudo apt-get install -y ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          export HOME="$(mktemp -d)"
          D="$HOME/.config/grokked-app"; mkdir -p "$D"
          GROKKED_PACKAGED=1 GROKKED_CONFIG_DIR="$D" GROKKED_DATA_DIR="$HOME/data" GROKKED_RUNTIME_DIR="$HOME/run" \
            GROKKED_PORT=8797 GROKKED_HOOKS_PORT=8798 \
            /usr/bin/grokked-node "/usr/lib/Grokked Bot/daemon/grokked.mjs" > daemon.log 2>&1 &
          for i in $(seq 1 30); do
            if [ -f "$D/token" ] && curl -sf -H "authorization: Bearer $(cat "$D/token")" \
                 http://127.0.0.1:8797/v1/health; then echo; echo "daemon healthy"; kill %1; exit 0; fi
            sleep 1
          done
          echo "daemon never became healthy:"; cat daemon.log; exit 1

      - name: Name the packages
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb out/Grokked-Bot-linux-amd64.deb
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage out/Grokked-Bot-linux-x86_64.AppImage
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: grokked-bot-linux
          path: out/*

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, mac-app, linux-app, computer-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: grokked-bot-*
          merge-multiple: true
          path: out
      - run: ls -la out
      # A version merged to main gets its tag here. Tags pushed with GITHUB_TOKEN
      # don't start workflows, so this doesn't run the release a second time.
      - name: Tag the release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git tag "v${{ needs.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ needs.version.outputs.version }}"
      # A draft, so the notes get a human read before they're public.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ needs.version.outputs.version }}
          name: Grokked Bot v${{ needs.version.outputs.version }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: out/*
