# Builds what a Mac user needs: the .dmg, and the bot computer image it pulls on
# first run. Run it by hand from the Actions tab, or push a v* tag to also cut a
# GitHub release with the .dmg files attached.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Builds the branch so the Mac app can be tried before it's merged.
    branches: [mac-dmg]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/grokked-computer

jobs:
  computer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: real Google Chrome doesn't ship for Linux arm64. Apple
      # Silicon runs it under Rosetta.
      - uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mac-app:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Both build on an Apple Silicon runner; Intel is a cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
      - run: scripts/fetch-node.sh ${{ matrix.target }}
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
        working-directory: apps/desktop

      # Start the daemon the way the app does -- the bundled node, inside the
      # signed .app, on the bundled daemon -- and require a healthy answer.
      # A signing problem (e.g. V8 can't JIT under the hardened runtime) kills
      # node before any of our code runs, and only shows up here or on a Mac.
      # Native arch only: the runner is Apple Silicon.
      - name: Smoke test the bundled daemon
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          APP="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Grokked Bot.app"
          codesign -dv --verbose=2 "$APP/Contents/MacOS/node" 2>&1 | grep -iE "flags|signature" || true
          export HOME="$(mktemp -d)" GROKKED_PORT=8790
          "$APP/Contents/MacOS/node" "$APP/Contents/Resources/daemon/grokked.mjs" > daemon.log 2>&1 &
          TOKEN_FILE="$HOME/Library/Application Support/Grokked/token"
          for i in $(seq 1 30); do
            if [ -f "$TOKEN_FILE" ] && curl -sf -H "authorization: Bearer $(cat "$TOKEN_FILE")" \
                 http://127.0.0.1:8790/v1/health; then echo; echo "daemon healthy"; kill %1; exit 0; fi
            sleep 1
          done
          echo "daemon never became healthy:"; cat daemon.log; ls -R "$APP/Contents" | head -40; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: grokked-bot-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
