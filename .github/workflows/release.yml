# Builds what a Mac user needs: the .dmg, and the bot computer image it pulls on
# first run. Run it by hand from the Actions tab, or push a v* tag to also cut a
# GitHub release with the .dmg files attached.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/grokked-computer

jobs:
  computer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: real Google Chrome doesn't ship for Linux arm64. Apple
      # Silicon runs it under Rosetta.
      - uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mac-app:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Both build on an Apple Silicon runner; Intel is a cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
      - run: scripts/fetch-node.sh ${{ matrix.target }}
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
        working-directory: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: grokked-bot-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
