; Startup order matters: X must exist before the WM, the WM before Chrome
; (unmanaged native dialogs are unfocusable and xdotool keys go to the wrong
; window), and Chrome before the shim can attach over CDP.

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac -nolisten tcp -dpi 96 +extension RANDR +extension GLX
priority=10
autorestart=unexpected
stdout_logfile=/var/log/grokked/xvfb.log
stderr_logfile=/var/log/grokked/xvfb.err

[program:openbox]
command=/usr/bin/openbox --sm-disable
priority=20
autorestart=true
startsecs=2
stdout_logfile=/var/log/grokked/openbox.log
stderr_logfile=/var/log/grokked/openbox.err

[program:tint2]
command=/usr/bin/tint2 -c /etc/xdg/tint2/tint2rc
priority=25
autorestart=true
startsecs=2
stdout_logfile=/var/log/grokked/tint2.log
stderr_logfile=/var/log/grokked/tint2.err

[program:x11vnc]
; -localhost: only websockify (in this container) may connect. -ncache 0 because
; client-side caching paints a duplicate framebuffer below the visible area,
; which looks broken inside a fixed-size iframe.
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -rfbport 5900 -localhost -shared -forever -noxdamage -ncache 0 -rfbauth /data/profile/.vncpasswd -quiet
priority=30
autorestart=true
startsecs=3
stdout_logfile=/var/log/grokked/x11vnc.log
stderr_logfile=/var/log/grokked/x11vnc.err

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=3
stdout_logfile=/var/log/grokked/websockify.log
stderr_logfile=/var/log/grokked/websockify.err

[program:chrome]
command=/usr/local/bin/chrome-wrapper.sh
priority=50
autorestart=true
startsecs=5
; Chrome must be allowed to flush Cookies/Preferences/Local Storage to disk.
; A SIGKILL here corrupts Preferences and shows the crash-restore bubble on
; every subsequent start.
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/var/log/grokked/chrome.log
stderr_logfile=/var/log/grokked/chrome.err

[program:shim]
command=/usr/bin/node /opt/shim/src/server.js
directory=/opt/shim
priority=60
autorestart=true
startsecs=3
stdout_logfile=/var/log/grokked/shim.log
stderr_logfile=/var/log/grokked/shim.err
